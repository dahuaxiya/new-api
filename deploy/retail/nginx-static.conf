# Include inside the retail server block. Compression is limited to public assets:
# authenticated API responses and SSE streams must retain their existing behavior.
location /static/ {
    try_files $uri =404;
    gzip on;
    # Prefer precompressed releases; dynamically compress when .gz is absent so
    # a deployment that only copies the normal bundle does not regress first load.
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript text/css image/svg+xml;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache";

    # Only content-hashed files are immutable. HTML, release metadata and files
    # with stable names must still revalidate after the current pointer changes.
    location ~ "^/static/.+\.[0-9a-f]{10}\.(?:js|css|svg|png|jpe?g|webp|avif|gif|ico|woff2?|ttf|otf)(?:\.LICENSE\.txt)?$" {
        try_files $uri =404;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
