# Place this file inside the nginx http context. Replace domain and certificate paths.
map $http_upgrade $new_api_connection_upgrade {
    default upgrade;
    "" close;
}

# Personal quota UI uses the pinned New API frontend; all model traffic stays in New API.
server {
    listen 10443 ssl;
    listen [::]:10443 ssl;
    server_name api.example.com;
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 32m;
    access_log off;
    error_log /var/log/nginx/new-api-error.log warn;
    root /var/www/new-api/current;
    gzip_static on;

    location ^~ /api/gpt-quota/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header New-Api-User $http_new_api_user;
        proxy_set_header Cookie "";
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 15s;
    }
    location ~ ^/(api|v1|mj|pg)(/|$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $new_api_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # Existing open tabs can still request unmodified release assets from the original app.
    location /static/ {
        try_files $uri @original_app;
    }
    location @original_app {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /quota-source.tar.gz {
        alias /var/www/new-api/quota-source.tar.gz;
        default_type application/gzip;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
