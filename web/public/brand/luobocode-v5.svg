<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">萝卜喵 · 比例精修</title>
  <desc id="desc">圆润的金渐层猫脸平滑收成短萝卜尖，小耳朵和相连的双叶保持紧凑，五官稍向中间靠拢。</desc>
  <!-- 叶柄先画、猫脸后画，让叶片真正接入头顶，避免悬空或像额外一对耳朵。 -->
  <g id="sprout" fill="#51674B">
    <path d="M128 86V64" stroke="#51674B" stroke-width="6" stroke-linecap="round"/>
    <path d="M127 70C109 69 99 51 105 45C120 45 131 57 127 70ZM129 67C129 50 145 40 159 44C158 59 145 71 129 67Z"/>
  </g>
  <!-- 脸颊到下巴连续收弧，不再分成两颗腮部和一截长根；耳尖保留圆角。 -->
  <path id="face" fill="#D0A05C" d="M51 112C47 100 47 82 52 71Q55 64 62 69L86 88C111 80 145 80 170 88L194 69Q201 64 204 71C209 82 209 100 205 112C215 132 214 154 199 170C181 187 154 199 136 204Q128 208 120 204C102 199 75 187 57 170C42 154 41 132 51 112Z"/>
  <g id="features" fill="#51674B">
    <circle cx="98" cy="139" r="6.5"/>
    <circle cx="158" cy="139" r="6.5"/>
    <path d="M123 157H133Q137 157 134 161L131 165Q128 168 125 165L122 161Q119 157 123 157Z"/>
  </g>
</svg>
